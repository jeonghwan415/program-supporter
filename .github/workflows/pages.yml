# main 브랜치에 올리면 GitHub Pages로 자동 배포해요 (빌드 없음, 프로그램 파일만 올림)
# 처음 한 번: 저장소 Settings → Pages → Source: GitHub Actions
name: Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 올릴 파일 고르기 (문서·도구 빼기)
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
